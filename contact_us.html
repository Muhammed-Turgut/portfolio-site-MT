<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stark Core Connect - İletişim</title>
    
    <!-- 🎨 Aynı fütüristik stil dosyasını yüklüyoruz -->
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* İletişim sayfasına özel ek ince ayarlar */
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
        }
        
        .contact-page-container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        .back-home-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--accent-gold);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 40px;
            transition: all 0.3s ease;
        }

        .back-home-btn:hover {
            color: var(--accent-red);
            transform: translateX(-5px);
        }

        .back-home-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .contact-header {
            margin-bottom: 50px;
        }

        .contact-title {
            font-size: 3.5rem;
            font-family: var(--font-title);
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .contact-title span {
            color: var(--accent-red);
            text-shadow: 0 0 10px rgba(255, 28, 64, 0.4);
        }

        .title-divider {
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-red), var(--accent-gold), transparent);
        }
    </style>
    
    <script src="contact.js" defer></script>
</head>

<body>
    <!-- 🌌 Arka Plan Fütüristik Işımalar -->
    <div class="blur-circle blur-circle-1"></div>
    <div class="blur-circle blur-circle-2"></div>

    <div class="contact-page-container">
        <!-- Ana Sayfaya Dönüş -->
        <a href="index.html" class="back-home-btn">
            <svg viewBox="0 0 24 24">
                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
            </svg>
            ANA SAYFAYA DÖN
        </a>

        <!-- Başlık -->
        <div class="contact-header">
            <h1 class="contact-title">STARK CORE<span> CONNECT</span></h1>
            <div class="title-divider"></div>
        </div>

        <!-- İletişim Detayları Grid -->
        <div class="contact-grid" style="margin-top: 0;">
            <!-- İletişim Bilgileri -->
            <div class="contact-info-container">
                <h3 class="contact-subtitle">İLETİŞİM PROTOKOLLERİ</h3>
                
                <div class="info-item">
                    <div class="info-icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56-.35-.12-.74-.03-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z" />
                        </svg>
                    </div>
                    <div class="info-text">
                        <h3>Telefon:</h3>
                        <p>0544 673 8200</p>
                    </div>
                </div>
                
                <div class="info-item">
                    <div class="info-icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z" />
                        </svg>
                    </div>
                    <div class="info-text">
                        <h3>E-Posta:</h3>
                        <p>muhammedtturgut@gmail.com</p>
                    </div>
                </div>
                
                <div style="margin-top: 50px;">
                    <a href="#" class="btn-stark btn-stark-outlined" style="gap: 10px;">
                        <svg viewBox="0 0 24 24" fill="currentColor" style="width: 20px; height: 20px;">
                            <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z" />
                        </svg>
                        ÖZGEÇMİŞİMİ (CV) İNDİR
                    </a>
                </div>
            </div>
            
            <!-- Fütüristik İletişim Formu -->
            <form class="contact-form">
                <input type="text" class="form-input" placeholder="Adınız Soyadınız" required>
                <input type="email" class="form-input" placeholder="E-Posta Adresiniz" required>
                <textarea class="form-input" placeholder="Bana iletmek istediğiniz mesaj..." required></textarea>
                <button type="submit" class="btn-submit">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
                    </svg>
                    MESAJI İLET ⚡
                </button>
            </form>
        </div>
    </div>
</body>

</html>
