<!DOCTYPE html>

    <style>
/* ============================================
   CONTACT US SECTION
   ============================================ */

#contact .section-content h1 {
  animation: fadeInUp 1s ease-out;
  position: relative;
  display: inline-block;
}

#contact .section-content h1::after {
  content: '';
  position: absolute;
  bottom: -15px;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 3px;
  background: var(--accent-color);
  animation: centerLineGrow 1.2s ease-out 0.5s forwards;
}

.contact-subtitle {
  font-size: 1.2rem;
  color: var(--text-color);
  text-align: center;
  margin-bottom: 60px;
  animation: fadeInUp 1.2s ease-out 0.3s backwards;
}

.contact-container {
  display: grid;
  grid-template-columns: 1fr 1.5fr;
  gap: 60px;
  margin-top: 60px;
  animation: fadeInUp 1.4s ease-out 0.5s backwards;
}

/* ============================================
   SOL TARAF - İLETİŞİM BİLGİLERİ
   ============================================ */

.contact-info {
  display: flex;
  flex-direction: column;
  gap: 30px;
}

.contact-item {
  display: flex;
  align-items: flex-start;
  gap: 20px;
  padding: 25px;
  background: rgba(100, 255, 218, 0.05);
  border: 2px solid rgba(100, 255, 218, 0.1);
  border-radius: 12px;
  transition: all 0.4s ease;
  animation: fadeInLeft 0.8s ease-out backwards;
}

.contact-item:nth-child(1) { animation-delay: 0.6s; }
.contact-item:nth-child(2) { animation-delay: 0.7s; }
.contact-item:nth-child(3) { animation-delay: 0.8s; }

.contact-item:hover {
  background: rgba(100, 255, 218, 0.1);
  border-color: var(--accent-color);
  transform: translateX(10px);
  box-shadow: 0 10px 30px rgba(100, 255, 218, 0.2);
}

.contact-icon {
  width: 50px;
  height: 50px;
  min-width: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(100, 255, 218, 0.1);
  border-radius: 50%;
  transition: all 0.4s ease;
}

.contact-item:hover .contact-icon {
  background: var(--accent-color);
  transform: rotate(360deg) scale(1.1);
}

.contact-icon svg {
  width: 24px;
  height: 24px;
  color: var(--accent-color);
  transition: color 0.3s ease;
}

.contact-item:hover .contact-icon svg {
  color: #0a2332;
}

.contact-details h3 {
  font-size: 1.2rem;
  color: white;
  margin-bottom: 8px;
  font-family: 'GTProelium', sans-serif;
}

.contact-details p {
  font-size: 1rem;
  color: var(--text-color);
}

/* Sosyal Medya Linkleri */
.contact-socials {
  display: flex;
  gap: 20px;
  padding: 25px;
  justify-content: center;
  animation: fadeInLeft 0.8s ease-out 0.9s backwards;
}

.contact-socials a {
  width: 50px;
  height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(100, 255, 218, 0.1);
  border: 2px solid rgba(100, 255, 218, 0.2);
  border-radius: 50%;
  transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
}

.contact-socials a:hover {
  background: var(--accent-color);
  border-color: var(--accent-color);
  transform: translateY(-8px) scale(1.15) rotate(5deg);
  box-shadow: 0 10px 25px rgba(100, 255, 218, 0.4);
}

.contact-socials svg {
  width: 24px;
  height: 24px;
  fill: var(--accent-color);
  transition: fill 0.3s ease;
}

.contact-socials a:hover svg {
  fill: #0a2332;
}

/* ============================================
   SAĞ TARAF - İLETİŞİM FORMU
   ============================================ */

.contact-form-wrapper {
  animation: fadeInRight 1s ease-out 0.7s backwards;
}

.contact-form {
  display: flex;
  flex-direction: column;
  gap: 25px;
}

.form-group {
  position: relative;
}

.form-group input,
.form-group textarea {
  width: 100%;
  padding: 18px 20px;
  background: rgba(100, 255, 218, 0.05);
  border: 2px solid rgba(100, 255, 218, 0.2);
  border-radius: 8px;
  color: white;
  font-size: 1rem;
  font-family: 'GTProelium', sans-serif;
  transition: all 0.3s ease;
  outline: none;
}

.form-group textarea {
  resize: vertical;
  min-height: 150px;
}

.form-group input:focus,
.form-group textarea:focus {
  border-color: var(--accent-color);
  background: rgba(100, 255, 218, 0.1);
  box-shadow: 0 0 20px rgba(100, 255, 218, 0.2);
}

.form-group label {
  position: absolute;
  left: 20px;
  top: 18px;
  color: var(--text-color);
  font-size: 1rem;
  pointer-events: none;
  transition: all 0.3s ease;
  background: transparent;
  padding: 0 5px;
}

.form-group input:focus + label,
.form-group textarea:focus + label,
.form-group input:not(:placeholder-shown) + label,
.form-group textarea:not(:placeholder-shown) + label {
  top: -12px;
  left: 15px;
  font-size: 0.85rem;
  color: var(--accent-color);
  background: var(--main-bg-color);
}

/* Submit Button */
.submit-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 18px 40px;
  background: transparent;
  border: 2px solid var(--accent-color);
  color: var(--accent-color);
  font-size: 1.1rem;
  font-weight: 600;
  font-family: 'Hatten', sans-serif;
  letter-spacing: 2px;
  cursor: pointer;
  border-radius: 8px;
  transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
  position: relative;
  overflow: hidden;
  align-self: flex-start;
}

.submit-button::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--accent-color);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.4s ease;
  z-index: -1;
}

.submit-button:hover::before {
  transform: scaleX(1);
}

.submit-button:hover {
  color: #0a2332;
  transform: translateY(-5px);
  box-shadow: 0 15px 35px rgba(100, 255, 218, 0.4);
}

.submit-button svg {
  width: 20px;
  height: 20px;
  transition: transform 0.3s ease;
}

.submit-button:hover svg {
  transform: translateX(5px) rotate(45deg);
}

/* ============================================
   RESPONSIVE DESIGN
   ============================================ */

@media (max-width: 1024px) {
  .contact-container {
    grid-template-columns: 1fr;
    gap: 50px;
  }

  .contact-info {
    order: 2;
  }

  .contact-form-wrapper {
    order: 1;
  }
}

@media (max-width: 768px) {
  .contact-subtitle {
    font-size: 1rem;
  }

  .contact-item {
    padding: 20px;
  }

  .contact-details h3 {
    font-size: 1rem;
  }

  .contact-details p {
    font-size: 0.9rem;
  }

  .form-group input,
  .form-group textarea {
    padding: 15px 18px;
  }

  .submit-button {
    width: 100%;
    padding: 16px 30px;
  }
}

/* ============================================
   ANİMASYONLAR
   ============================================ */

@keyframes fadeInLeft {
  from {
    opacity: 0;
    transform: translateX(-30px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

@keyframes fadeInRight {
  from {
    opacity: 0;
    transform: translateX(30px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}
</style>
