<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stark Core // Privacy Policy Center</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* 🎨 Iron Man / Stark Industries Tasarım Sistemi & Değişkenleri */
        :root {
            --main-bg: #0b0809;             /* Metalik Karbon Siyahı */
            --card-bg: rgba(20, 15, 17, 0.75); /* Yarı saydam metalik panel */
            --accent-red: #ff1c40;          /* Hot Rod Stark Kırmızısı */
            --accent-red-hover: #e51335;
            --accent-gold: #ffb700;         /* Zırh Altın Sarısı */
            --glow-cyan: #00f0ff;           /* Ark Reaktörü Buz Mavisi */
            --text-primary: #ffffff;        /* Birincil Metin Beyazı */
            --text-secondary: #c5bec2;      /* İkincil Kül Grisi */
            --border-glow: rgba(0, 240, 255, 0.15);
            
            --font-body: 'Outfit', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--main-bg);
            color: var(--text-primary);
            font-family: var(--font-body);
            line-height: 1.8;
            overflow-x: hidden;
            position: relative;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 28, 64, 0.06) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(255, 183, 0, 0.05) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(0, 240, 255, 0.04) 0%, transparent 50%);
            background-attachment: fixed;
            padding: 40px 20px;
        }

        /* 🌌 Fütüristik Arka Plan Daireleri */
        .blur-circle {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: -1;
        }

        .blur-circle-1 {
            top: -10%;
            right: 5%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255, 28, 64, 0.1) 0%, transparent 70%);
        }

        .blur-circle-2 {
            bottom: -10%;
            left: 5%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 240, 255, 0.08) 0%, transparent 70%);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        /* 🦾 Stark Core Üst Panel */
        .header {
            text-align: center;
            margin-bottom: 30px;
            background: var(--card-bg);
            border: 1px solid rgba(255, 28, 64, 0.25);
            padding: 30px;
            border-radius: 16px;
            backdrop-filter: blur(15px);
            box-shadow: 
                0 15px 35px rgba(0, 0, 0, 0.6),
                0 0 15px rgba(0, 240, 255, 0.08);
            position: relative;
        }

        .header::before {
            content: 'STARK CORE SECURITY PROTOCOL // v4.2';
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--accent-gold);
            text-shadow: 0 0 5px rgba(255, 183, 0, 0.5);
        }

        .logo-container {
            margin-top: 15px;
            margin-bottom: 10px;
        }

        .logo-container svg {
            width: 50px;
            height: 50px;
            fill: var(--glow-cyan);
            filter: drop-shadow(0 0 10px var(--glow-cyan));
            animation: pulse-arc 3s ease-in-out infinite;
        }

        @keyframes pulse-arc {
            0%, 100% { filter: drop-shadow(0 0 5px var(--glow-cyan)); opacity: 0.8; }
            50% { filter: drop-shadow(0 0 15px var(--glow-cyan)); opacity: 1; }
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 1px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        h1 span {
            color: var(--accent-red);
            text-shadow: 0 0 10px rgba(255, 28, 64, 0.4);
        }

        .header p {
            color: var(--text-secondary);
            font-size: 1rem;
            font-weight: 500;
        }

        /* 📱 Uygulama Seçim Paneli (App Selector Grid) */
        .selector-box {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom: 3px solid var(--accent-gold);
            border-radius: 14px;
            padding: 25px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        .selector-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .app-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
            text-align: left;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .app-btn:hover {
            background: rgba(255, 28, 64, 0.05);
            border-color: rgba(255, 28, 64, 0.4);
            color: #ffffff;
            transform: translateY(-2px);
        }

        .app-btn.active {
            background: rgba(0, 240, 255, 0.08);
            border-color: var(--glow-cyan);
            color: #ffffff;
            box-shadow: 
                0 0 15px rgba(0, 240, 255, 0.15),
                inset 0 0 8px rgba(0, 240, 255, 0.05);
        }

        .app-btn-icon {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: all 0.3s ease;
        }

        .app-btn.active .app-btn-icon {
            background: rgba(0, 240, 255, 0.15);
            color: var(--glow-cyan);
            filter: drop-shadow(0 0 5px var(--glow-cyan));
        }

        .app-btn-info {
            display: flex;
            flex-direction: column;
        }

        .app-btn-name {
            font-weight: 700;
            font-size: 0.95rem;
        }

        .app-btn-category {
            font-size: 0.75rem;
            color: var(--accent-gold);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        /* 📄 Kontrol Paneli (Language, Copy, Print) */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 15px 25px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        /* Dil seçici toggle */
        .lang-switch {
            display: flex;
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            padding: 4px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .lang-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-weight: 700;
            font-size: 0.85rem;
            padding: 6px 16px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .lang-btn.active {
            background: var(--accent-red);
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(255, 28, 64, 0.3);
        }

        /* İşlem butonları */
        .action-group {
            display: flex;
            gap: 10px;
        }

        .btn-action {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            color: #ffffff;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .btn-action:hover {
            background: rgba(0, 240, 255, 0.08);
            border-color: var(--glow-cyan);
            transform: translateY(-1px);
        }

        .btn-action svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* 📖 Gizlilik Politikası Okuma Paneli (Reading Panel) */
        .policy-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-left: 5px solid var(--accent-red);
            border-radius: 16px;
            padding: 50px;
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            position: relative;
        }

        .policy-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, transparent 80%, rgba(0, 240, 255, 0.05) 100%);
            border-bottom-right-radius: 16px;
            pointer-events: none;
        }

        .policy-header {
            margin-bottom: 35px;
            border-bottom: 2px dashed rgba(255, 255, 255, 0.1);
            padding-bottom: 25px;
        }

        .policy-app-badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--accent-gold);
            background: rgba(255, 183, 0, 0.1);
            border: 1px solid rgba(255, 183, 0, 0.2);
            padding: 4px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .policy-title {
            font-size: 2rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .policy-meta {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* Politika Metin Biçimlendirmesi */
        .policy-body {
            font-size: 1.05rem;
            color: var(--text-secondary);
            text-align: justify;
        }

        .policy-body h2 {
            font-size: 1.4rem;
            color: #ffffff;
            margin-top: 40px;
            margin-bottom: 15px;
            font-weight: 700;
            border-left: 3px solid var(--accent-gold);
            padding-left: 12px;
            letter-spacing: 0.5px;
        }

        .policy-body h3 {
            font-size: 1.15rem;
            color: var(--glow-cyan);
            margin-top: 25px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .policy-body p {
            margin-bottom: 20px;
            line-height: 1.8;
        }

        .policy-body ul {
            margin-left: 20px;
            margin-bottom: 25px;
            list-style-type: none;
        }

        .policy-body li {
            margin-bottom: 10px;
            position: relative;
            padding-left: 20px;
        }

        .policy-body li::before {
            content: '⚡';
            position: absolute;
            left: 0;
            top: 1px;
            font-size: 0.85rem;
            color: var(--accent-red);
        }

        .policy-body strong {
            color: #ffffff;
            font-weight: 600;
        }

        /* Özel kutular */
        .policy-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-left: 4px solid var(--accent-red);
            border-radius: 8px;
            padding: 20px;
            margin: 25px 0;
        }

        .policy-box-info {
            border-left-color: var(--glow-cyan);
            background: rgba(0, 240, 255, 0.02);
        }

        .policy-box-warning {
            border-left-color: var(--accent-gold);
            background: rgba(255, 183, 0, 0.02);
        }

        .policy-box h4 {
            font-size: 1rem;
            color: #ffffff;
            margin-bottom: 8px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* 📋 Toast Uyarı Kutusu */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #0b0809;
            border: 1px solid var(--glow-cyan);
            border-radius: 8px;
            padding: 15px 25px;
            box-shadow: 0 10px 30px rgba(0, 240, 255, 0.2);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 12px;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast-icon {
            color: var(--glow-cyan);
            font-size: 1.2rem;
            font-weight: bold;
        }

        .toast-text {
            color: #ffffff;
            font-size: 0.9rem;
            font-weight: 600;
        }

        /* 🔗 Geri Dön Linki */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            margin-top: 30px;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: var(--accent-red);
        }

        /* 🖨️ YAZICI / PDF STYLING (Google Play Console için Kusursuz Çıktı) */
        @media print {
            body {
                background: #ffffff !important;
                color: #000000 !important;
                padding: 0 !important;
                font-size: 12pt;
                line-height: 1.6;
            }

            .blur-circle, 
            .header, 
            .selector-box, 
            .controls, 
            .back-link,
            .toast {
                display: none !important; /* Çıktıda kontrolleri ve süsleri tamamen gizle */
            }

            .container {
                max-width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            .policy-card {
                background: #ffffff !important;
                border: none !important;
                padding: 0 !important;
                box-shadow: none !important;
            }

            .policy-app-badge {
                color: #000000 !important;
                background: none !important;
                border: 1px solid #000000 !important;
                padding: 2px 8px !important;
                font-size: 10pt !important;
            }

            .policy-title {
                color: #000000 !important;
                font-size: 24pt !important;
                margin-top: 0 !important;
            }

            .policy-meta {
                color: #555555 !important;
                font-size: 10pt !important;
            }

            .policy-body {
                color: #000000 !important;
            }

            .policy-body h2 {
                color: #000000 !important;
                border-left: 4px solid #000000 !important;
                font-size: 16pt !important;
                page-break-after: avoid;
            }

            .policy-body h3 {
                color: #000000 !important;
                font-size: 13pt !important;
                page-break-after: avoid;
            }

            .policy-body strong {
                color: #000000 !important;
            }

            .policy-box {
                background: #f9f9f9 !important;
                border: 1px solid #dddddd !important;
                border-left: 4px solid #000000 !important;
                color: #000000 !important;
            }

            .policy-box h4 {
                color: #000000 !important;
            }

            .policy-body li::before {
                content: '•' !important;
                color: #000000 !important;
            }
        }

        /* 📱 Mobil Uyum */
        @media (max-width: 768px) {
            body {
                padding: 20px 10px;
            }

            .header {
                padding: 20px 15px;
            }

            h1 {
                font-size: 1.6rem;
            }

            .policy-card {
                padding: 25px 20px;
            }

            .policy-title {
                font-size: 1.5rem;
            }

            .controls {
                flex-direction: column;
                gap: 15px;
                align-items: stretch;
            }

            .lang-switch {
                justify-content: center;
            }

            .action-group {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- 🌌 Işımalar -->
    <div class="blur-circle blur-circle-1"></div>
    <div class="blur-circle blur-circle-2"></div>

    <div class="container">
        <!-- 🦾 Stark Core Üst Panel -->
        <div class="header">
            <div class="logo-container">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5" fill="none"/>
                    <circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="1.5" fill="none"/>
                    <circle cx="12" cy="12" r="2" fill="currentColor"/>
                    <path d="M12 3v4M12 17v4M3 12h4M17 12h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
            </div>
            <h1>Stark <span>Privacy Center</span></h1>
            <p>Mobil Uygulama Gizlilik Politikası & Play Store Uyum Protokolü</p>
        </div>

        <!-- 📱 Uygulama Seçim Kutusu -->
        <div class="selector-box" id="app-selector-container">
            <div class="selector-title">
                <span>🛡️ Geliştirici Uygulama Listesi:</span>
            </div>
            <div class="app-grid" id="app-buttons-grid">
                <!-- Javascript ile Doldurulacak -->
            </div>
        </div>

        <!-- 📄 Kontroller (Dil, Kopyala, Yazdır) -->
        <div class="controls">
            <!-- Dil seçici -->
            <div class="lang-switch">
                <button class="lang-btn active" id="btn-lang-tr" onclick="setLanguage('tr')">Türkçe</button>
                <button class="lang-btn" id="btn-lang-en" onclick="setLanguage('en')">English</button>
            </div>
            
            <!-- Aksiyonlar -->
            <div class="action-group">
                <button class="btn-action" onclick="copyPolicyText()">
                    <svg viewBox="0 0 24 24">
                        <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
                    </svg>
                    <span id="text-copy-btn">Metni Kopyala</span>
                </button>
                <button class="btn-action" onclick="window.print()">
                    <svg viewBox="0 0 24 24">
                        <path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/>
                    </svg>
                    <span id="text-print-btn">Yazdır / PDF Kaydet</span>
                </button>
            </div>
        </div>

        <!-- 📖 Okuma Kartı -->
        <div class="policy-card">
            <div class="policy-header">
                <span class="policy-app-badge" id="policy-app-badge">Uygulama</span>
                <h2 class="policy-title" id="policy-title">Gizlilik Politikası</h2>
                <div class="policy-meta" id="policy-meta">Son Güncelleme: 25 Mayıs 2026 // Geliştirici: Muhammed Turgut</div>
            </div>
            <div class="policy-body" id="policy-body">
                <!-- Dinamik Politika Metni Buraya Gelecek -->
            </div>
        </div>

        <!-- 🔗 Geri Dönüş Linki -->
        <a href="index.html" class="back-link">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
            </svg>
            Ana Sayfaya Geri Dön
        </a>
    </div>

    <!-- 📋 Kopyalama Toast Kutusu -->
    <div class="toast" id="toast-notification">
        <span class="toast-icon">✓</span>
        <span class="toast-text" id="toast-text">Politika metni kopyalandı!</span>
    </div>

    <!-- 🧠 POLİTİKALAR VERİ TABANI & MOTORU -->
    <script>
        // Tüm Uygulamaların Politika Veritabanı
        const POLICIES_DATABASE = {
            "qritik": {
                name: "QRitik QR Code Scanning App",
                category: "Mobile",
                icon: "🔍",
                tr: {
                    appType: "Mobil Uygulama",
                    title: "QRitik QR Code Scanning App Gizlilik Politikası",
                    content: `
                        <p>Bu gizlilik politikası, <strong>Muhammed Turgut</strong> tarafından geliştirilen <strong>QRitik QR Code Scanning App</strong> mobil uygulamasının (bundan sonra "Uygulama" olarak anılacaktır) kullanımı ile ilgili koşulları ve veri işleme süreçlerini açıklar. Uygulamamızı kullanarak bu politikada yer alan esasları kabul etmiş olursunuz.</p>
                        
                        <h2>1. Bilgi Toplama ve Kullanımı</h2>
                        <p><strong>QRitik uygulaması kullanıcıların gizliliğine son derece önem verir ve minimum veri toplama prensibini benimser.</strong> Uygulamayı kullanmak için herhangi bir hesap oluşturmanız veya kişisel bilgilerinizi (isim, e-posta, telefon numarası vb.) paylaşmanız gerekmez. Uygulama, doğrudan kimliğinizi belirleyebilecek hiçbir kişisel veriyi toplamaz, saklamaz veya üçüncü taraflarla paylaşmaz.</p>

                        <h2>2. Cihaz İzinleri ve İşleme Amaçları</h2>
                        <p>Uygulama, temel işlevlerini yerine getirebilmek için cihazınızda aşağıdaki izinlere gereksinim duyar. Bu izinler kapsamında erişilen hiçbir veri sunucularımıza veya herhangi bir dış kuruluşa <strong>gönderilmez</strong>; tamamen cihazınızda yerel olarak işlenir:</p>
                        <ul>
                            <li><strong>Kamera İzni (Camera):</strong> Uygulamanın QR kodları ve barkodları gerçek zamanlı olarak tarayabilmesi için gereklidir. Kamera görüntüsü anlık olarak Jetpack Compose ve CameraX kütüphaneleriyle cihaz üzerinde işlenir ve hiçbir şekilde kaydedilmez veya sunuculara yüklenmez.</li>
                            <li><strong>Depolama İzni (Storage / Gallery):</strong> Oluşturduğunuz veya tarattığınız QR kod resimlerini cihazınızın galerisine kaydetmek veya galerinizden mevcut bir QR kodu seçip taratmak istediğinizde bu izne ihtiyaç duyulur.</li>
